name: Build

# Unit tests and a Release publish of the demo app with the WinUI fork runtime.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch WinUI runtime
        shell: pwsh
        run: .\tools\Get-WinUIRuntime.ps1

      - name: Unit tests
        shell: pwsh
        run: |
          dotnet test InkPages.Tests -nologo -v q
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }

      - name: Publish demo
        shell: pwsh
        run: |
          dotnet publish InkPages.Demo -c Release -o out\demo -nologo -v q
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
