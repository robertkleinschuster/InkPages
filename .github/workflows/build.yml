name: Build

# Release build of the C++ library, the demo and the unit tests (CMake + Visual Studio on the runner, CTest).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and unit tests
        shell: pwsh
        run: .\build.ps1
